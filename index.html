<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site Interativo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f3f4f6; color: #1f2937; margin-top: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        button { background-color: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.2s; }
        button:hover { background-color: #2563eb; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Olá! Bem-vindo ao meu site. 🎉</h1>
        <p>Este arquivo HTML está hospedado no GitHub Pages.</p>
        <button onclick="alert('O JavaScript também está funcionando perfeitamente!')">Clique para interagir</button>
    </div>
</body>
</html>
